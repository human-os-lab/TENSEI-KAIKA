<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天性鑑定 | 天性開花学</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Cinzel+Decorative:wght@400;700&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-navy: #0a0a1a;
    --royal-purple: #1a0a3a;
    --violet: #2d1b69;
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-bright: #ffd700;
    --white: #f5f0e8;
    --white-dim: rgba(245,240,232,0.7);
    --glow: rgba(201,168,76,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep-navy);
    color: var(--white);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(45,27,105,0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(26,10,58,0.8) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(10,10,26,1) 0%, transparent 100%);
    z-index: 0;
  }

  /* 浮遊する数字 */
  .floating-numbers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .float-num {
    position: absolute;
    font-family: 'Cinzel Decorative', serif;
    color: rgba(255,220,100,0.12);
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-100px) rotate(20deg); opacity: 0; }
  }

  .page { display: none; position: relative; z-index: 1; }
  .page.active { display: block; }

  /* TOP */
  #page-top {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px;
    position: relative; z-index: 1;
  }

  .mandala {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    animation: spin 30s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .mandala svg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px var(--gold)); }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px; text-align: center;
  }

  .subtitle {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem; letter-spacing: 0.4em;
    color: var(--gold); opacity: 0.7; font-weight: 300;
    text-align: center;
  }

  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 32px 0;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider span { color: var(--gold); font-size: 1rem; }

  .card {
    background: linear-gradient(135deg, rgba(60,30,120,0.7) 0%, rgba(35,15,80,0.85) 100%);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px; padding: 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,168,76,0.1);
    position: relative; width: 100%; max-width: 480px;
  }

  .corner { position: absolute; width: 16px; height: 16px; border-color: var(--gold); border-style: solid; opacity: 0.6; }
  .corner.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

  .input-group { margin-bottom: 28px; }

  label {
    display: block; font-size: 0.7rem;
    letter-spacing: 0.3em; color: var(--gold);
    opacity: 0.8; margin-bottom: 10px; font-weight: 300;
  }

  input[type="text"], input[type="date"], textarea {
    width: 100%;
    background: rgba(10,10,26,0.6);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--white); padding: 14px 18px;
    font-family: 'Noto Serif JP', serif; font-size: 0.9rem;
    outline: none; transition: border-color 0.3s, box-shadow 0.3s;
    border-radius: 1px;
  }
  input:focus, textarea:focus {
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7) sepia(1) saturate(2) hue-rotate(5deg); opacity: 0.6;
  }
  textarea { resize: none; height: 80px; }

  .btn-kantei {
    width: 100%; padding: 18px;
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'Cinzel Decorative', serif; font-size: 0.85rem;
    letter-spacing: 0.3em; cursor: pointer;
    position: relative; overflow: hidden; transition: all 0.4s; margin-top: 8px;
  }
  .btn-kantei::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold-bright));
    opacity: 0; transition: opacity 0.4s;
  }
  .btn-kantei:hover::before { opacity: 0.15; }
  .btn-kantei:hover { box-shadow: 0 0 30px rgba(201,168,76,0.3); }
  .btn-kantei span { position: relative; z-index: 1; }

  .error-msg { color: #ff6b6b; font-size: 0.75rem; text-align: center; margin-top: 16px; }

  /* ローディング */
  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10,10,26,0.95); z-index: 100;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
  }
  .loading-overlay.show { display: flex; }
  .loading-star { font-size: 2.5rem; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .loading-msg {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.85rem; letter-spacing: 0.3em;
    color: var(--gold-bright); font-weight: 300;
  }

  /* RESULT PAGE */
  #page-result {
    min-height: 100vh; padding: 0 0 80px;
    position: relative; z-index: 1;
  }

  .result-hero {
    padding: 80px 24px 48px; text-align: center;
    border-bottom: 1px solid rgba(201,168,76,0.1);
  }
  .result-label {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.55rem; letter-spacing: 0.6em;
    color: var(--gold); opacity: 0.6; margin-bottom: 20px;
  }
  .result-person {
    font-size: 0.75rem; letter-spacing: 0.3em;
    color: var(--white-dim); margin-bottom: 14px;
  }
  .result-character {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.8rem, 9vw, 5rem);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    letter-spacing: 0.1em; line-height: 1.2;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.4));
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { filter: drop-shadow(0 0 15px rgba(201,168,76,0.2)); }
    50% { filter: drop-shadow(0 0 35px rgba(201,168,76,0.5)); }
  }
  .result-gold-line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 28px auto;
  }
  .result-birthday { font-size: 0.65rem; color: var(--white-dim); letter-spacing: 0.2em; }

  .result-body { max-width: 520px; margin: 0 auto; padding: 0 20px; }

  .result-section {
    margin-bottom: 28px; padding: 28px 24px;
    background: linear-gradient(135deg, rgba(45,27,105,0.4), rgba(26,10,58,0.6));
    border: 1px solid rgba(201,168,76,0.1);
    animation: fadeUp 0.7s ease both;
  }
  .result-section:nth-child(2) { animation-delay: 0.1s; }
  .result-section:nth-child(3) { animation-delay: 0.2s; }
  .result-section:nth-child(4) { animation-delay: 0.3s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .section-tag {
    font-size: 0.55rem; letter-spacing: 0.5em;
    color: var(--gold); opacity: 0.55; margin-bottom: 10px;
    font-family: 'Cinzel Decorative', serif;
  }
  .section-title {
    font-size: 1rem; font-weight: 700;
    color: var(--gold-light); margin-bottom: 12px; letter-spacing: 0.1em;
  }
  .section-text {
    font-size: 0.82rem; line-height: 2.2;
    color: var(--white-dim); letter-spacing: 0.04em;
  }

  /* 追加コメント欄 */
  .more-section {
    margin-top: 8px; padding: 28px 24px;
    background: rgba(45,27,105,0.3);
    border: 1px solid rgba(201,168,76,0.1);
    animation: fadeUp 0.7s ease 0.4s both;
  }
  .more-label {
    font-size: 0.6rem; letter-spacing: 0.4em;
    color: var(--gold); opacity: 0.6; margin-bottom: 10px;
    font-family: 'Cinzel Decorative', serif;
  }
  .more-title {
    font-size: 0.82rem; color: var(--white-dim);
    letter-spacing: 0.08em; line-height: 1.8; margin-bottom: 16px;
  }
  textarea.more-input {
    width: 100%; background: rgba(10,10,26,0.6);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--white); padding: 12px 14px;
    font-family: 'Noto Serif JP', serif; font-size: 0.82rem;
    outline: none; resize: none; height: 80px;
    transition: border-color 0.3s;
  }
  textarea.more-input:focus { border-color: rgba(201,168,76,0.5); }
  textarea.more-input::placeholder { color: rgba(245,240,232,0.2); }

  .btn-send {
    width: 100%; padding: 14px; margin-top: 12px;
    background: transparent; border: 1px solid rgba(201,168,76,0.4);
    color: var(--gold); font-family: 'Cinzel Decorative', serif;
    font-size: 0.65rem; letter-spacing: 0.3em; cursor: pointer; transition: all 0.3s;
  }
  .btn-send:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }
  .send-done { font-size: 0.7rem; color: var(--gold-bright); text-align: center; margin-top: 10px; display: none; letter-spacing: 0.2em; }
</style>
</head>
<body>

<div class="floating-numbers" id="floatingNums"></div>



<!-- TOP PAGE -->
<div class="page active" id="page-top">

  </div>
</div>

<!-- RESULT PAGE -->
<div class="page" id="page-result">
  <div class="result-hero">
    <div class="result-label">✦ YOUR TENSEI READING ✦</div>
    <div class="result-person" id="result-person"></div>
    <div class="result-character" id="result-character"></div>
    <div class="result-gold-line"></div>
    <div class="result-birthday" id="result-birthday"></div>

  <div class="result-body">

    <div class="more-section">
      <div class="more-label">MORE</div>

      <textarea class="more-input" id="more-input" placeholder="気になること、聞きたいことを自由に書いてください"></textarea>

      <div class="send-done" id="send-done">✦ えっちゃんに届きました ✦</div>
    </div>
  </div>
</div>

  el.className = 'float-num';

  el.style.animationDuration = (15+Math.random()*25)+'s';
  el.style.animationDelay = (-Math.random()*30)+'s';

}

let currentName='', currentResult='';
const startTime = { val: 0 };

async function doKantei(){
  const name = document.getElementById('name').value.trim();
  const birthday = document.getElementById('birthday').value;
  const comment = document.getElementById('comment').value;
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';

  if(!name){ errEl.textContent = 'お名前を入力してください'; return; }
  if(!birthday){ errEl.textContent = '生年月日を入力してください'; return; }

  const btn = document.querySelector('.btn-kantei');
  btn.innerHTML = '<span>⟳ 宇宙の叡智とつながっています...</span>';
  btn.disabled = true;
  btn.style.color = 'var(--gold-bright)';
  startTime.val = Date.now();

  try {
    const res = await fetch('/kantei', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, birthday, comment})
    });
    const data = await res.json();
    if(data.error){
      errEl.textContent = data.error;
      btn.innerHTML = '<span>✦ 天 性 を 解 き 明 か す ✦</span>';
      btn.disabled = false; btn.style.color = '';
      return;
    }
    currentName = name; currentResult = data.result;
    const elapsed = Date.now() - startTime.val;
    const wait = Math.max(0, 3000 - elapsed);
    setTimeout(() => {
      btn.innerHTML = '<span>✦ 天 性 を 解 き 明 か す ✦</span>';
      btn.disabled = false; btn.style.color = '';
      showResult(name, birthday, data.result);
    }, wait);
  } catch(e) {
    errEl.textContent = 'エラーが発生しました';
    btn.innerHTML = '<span>✦ 天 性 を 解 き 明 か す ✦</span>';
    btn.disabled = false; btn.style.color = '';
  }
}

function showResult(name, birthday, character){
  document.getElementById('result-person').textContent = `✦ ${name} ✦`;
  document.getElementById('result-character').textContent = character;
  document.getElementById('result-birthday').textContent = birthday.replace(/-/g,'. ');

  const d = DB[character] || DB['単星'];
  const el = document.getElementById('result-sections');
  el.innerHTML = `
    <div style="text-align:center;margin:32px 0 20px;font-size:0.65rem;letter-spacing:0.4em;color:var(--gold);opacity:0.6;">${d.theme}</div>
    ${d.sections.map(s=>`
      <div class="result-section">
        <div class="section-tag">${s.tag}</div>
        <div class="section-title">${s.title}</div>
        <div class="section-text">${s.text}</div>
      </div>
    `).join('')}
  `;

  document.getElementById('more-input').value='';
  document.getElementById('send-done').style.display='none';
  document.getElementById('page-top').style.display='none';
  document.getElementById('page-result').style.display='block';
  document.getElementById('page-top').classList.remove('active');
  document.getElementById('page-result').classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}

async function sendMore(){
  const more = document.getElementById('more-input').value.trim();
  if(!more) return;
  try {
    await fetch('/more', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:currentName, result:currentResult, comment:more})
    });
  } catch(e){}
  document.getElementById('send-done').style.display='block';
  document.getElementById('more-input').value='';
  setTimeout(() => {
    document.getElementById('page-result').style.display='none';
    document.getElementById('page-top').style.display='block';
    document.getElementById('page-result').classList.remove('active');
    document.getElementById('page-top').classList.add('active');
    window.scrollTo({top:0, behavior:'instant'});
  }, 1500);
}
</script>
