<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天性鑑定 | 天性開花学</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;700&family=Cinzel:wght@400;600;700&family=Shippori+Mincho:wght@400;500;700;800&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #05050f;
  --deep: #0a0820;
  --purple: #150d35;
  --gold: #c8a45a;
  --gold-light: #e8c878;
  --gold-dim: rgba(200,164,90,0.4);
  --white: #f0ebe0;
  --white-dim: rgba(240,235,224,0.6);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--navy);
  color: var(--white);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.star {
  position: absolute; width: 1px; height: 1px;
  background: white; border-radius: 50%;
  animation: twinkle linear infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.1; } 50% { opacity: 0.9; }
}

.orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.orb-1 { width: 400px; height: 400px; background: rgba(80,40,140,0.2); top: -100px; left: -100px; }
.orb-2 { width: 300px; height: 300px; background: rgba(180,130,60,0.08); bottom: 100px; right: -50px; }

.page { display: none; position: relative; z-index: 1; }
.page.active { display: block; }

/* ===== TOP ===== */
#page-top {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 24px;
}

.mandala {
  width: 90px; height: 90px;
  margin: 0 auto 20px;
  animation: rotateSlow 40s linear infinite;
}
@keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.brand-sub {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem; letter-spacing: 0.5em;
  color: var(--gold); opacity: 0.65;
  text-align: center; margin-bottom: 16px;
}

.brand-title {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 700; text-align: center;
  letter-spacing: 0.25em; line-height: 1.6;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 70%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.brand-catch {
  font-size: 0.8rem; color: var(--white-dim);
  text-align: center; letter-spacing: 0.15em;
  line-height: 2; margin-top: 12px;
}

.divider-line {
  width: 1px; height: 48px;
  background: linear-gradient(180deg, transparent, var(--gold-dim), transparent);
  margin: 28px auto;
}

.input-card {
  width: 100%; max-width: 460px;
  background: linear-gradient(135deg, rgba(21,13,53,0.8), rgba(10,8,32,0.9));
  border: 1px solid rgba(200,164,90,0.18);
  padding: 36px 28px; position: relative;
}

.field { margin-bottom: 22px; }
.field-label {
  display: block; font-size: 0.6rem;
  letter-spacing: 0.4em; color: var(--gold);
  opacity: 0.75; margin-bottom: 10px;
  font-family: 'Cinzel', serif;
}
.field-note {
  font-size: 0.65rem; color: var(--white-dim);
  letter-spacing: 0.05em; margin-top: 6px;
  opacity: 0.7;
}

.field-input {
  width: 100%; background: rgba(5,5,15,0.8);
  border: none; border-bottom: 1px solid rgba(200,164,90,0.2);
  color: var(--white); padding: 12px 4px;
  font-family: 'Noto Serif JP', serif; font-size: 0.9rem;
  outline: none; transition: border-color 0.3s;
}
.field-input:focus { border-bottom-color: var(--gold); }
.field-input::placeholder { color: rgba(240,235,224,0.2); }
.field-input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.6) sepia(1) saturate(2); opacity: 0.5; cursor: pointer;
}

textarea.field-input {
  resize: none; height: 80px;
  border: 1px solid rgba(200,164,90,0.15);
  padding: 10px 12px;
}

.btn-main {
  width: 100%; padding: 17px;
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold-light);
  font-family: 'Cinzel', serif; font-size: 0.75rem;
  letter-spacing: 0.4em; cursor: pointer;
  position: relative; overflow: hidden; transition: all 0.4s;
  margin-top: 8px;
}
.btn-main::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(200,164,90,0.08);
  transform: translateX(-100%); transition: transform 0.4s;
}
.btn-main:hover::before { transform: translateX(0); }
.btn-main:hover { box-shadow: 0 0 20px rgba(200,164,90,0.15); }
.btn-main span { position: relative; z-index: 1; }

.error { color: #e06060; font-size: 0.7rem; text-align: center; margin-top: 12px; }

/* ===== LOADING ===== */
.loading-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(5,5,15,0.95); z-index: 100;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
}
.loading-overlay.show { display: flex; }
.loading-star { font-size: 2rem; animation: spinStar 2s ease-in-out infinite; }
@keyframes spinStar {
  0% { transform: rotate(0deg) scale(0.8); opacity: 0.3; }
  50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
  100% { transform: rotate(360deg) scale(0.8); opacity: 0.3; }
}
.loading-text {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.5em; color: var(--gold); opacity: 0.7;
}

/* ===== RESULT ===== */
#page-result { min-height: 100vh; padding-bottom: 80px; }

.result-hero {
  padding: 80px 24px 48px; text-align: center;
  border-bottom: 1px solid rgba(200,164,90,0.1);
}
.result-label {
  font-family: 'Cinzel', serif; font-size: 0.55rem;
  letter-spacing: 0.6em; color: var(--gold); opacity: 0.55; margin-bottom: 20px;
}
.result-person {
  font-size: 0.75rem; letter-spacing: 0.3em;
  color: var(--white-dim); margin-bottom: 14px;
}
.result-character {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(2.8rem, 9vw, 5rem); font-weight: 700;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 70%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 0.15em; line-height: 1.2;
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { filter: drop-shadow(0 0 15px rgba(200,164,90,0.2)); }
  50% { filter: drop-shadow(0 0 35px rgba(200,164,90,0.5)); }
}
.result-gold-line {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 28px auto;
}
.result-birthday { font-size: 0.65rem; color: var(--white-dim); letter-spacing: 0.2em; }

.result-body { max-width: 520px; margin: 0 auto; padding: 0 20px; }

.result-section {
  margin-bottom: 32px; padding: 28px 24px;
  background: linear-gradient(135deg, rgba(21,13,53,0.5), rgba(10,8,32,0.7));
  border: 1px solid rgba(200,164,90,0.1);
  animation: fadeUp 0.7s ease both;
}
.result-section:nth-child(2) { animation-delay: 0.1s; }
.result-section:nth-child(3) { animation-delay: 0.2s; }
.result-section:nth-child(4) { animation-delay: 0.3s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-tag {
  font-family: 'Cinzel', serif; font-size: 0.5rem;
  letter-spacing: 0.5em; color: var(--gold); opacity: 0.55; margin-bottom: 10px;
}
.section-title {
  font-family: 'Shippori Mincho', serif; font-size: 1rem;
  font-weight: 700; color: var(--gold-light); margin-bottom: 12px; letter-spacing: 0.1em;
}
.section-text {
  font-size: 0.82rem; line-height: 2.2;
  color: var(--white-dim); letter-spacing: 0.04em;
}

/* 追加質問欄 */
.more-question {
  margin-top: 8px; padding: 28px 24px;
  background: rgba(21,13,53,0.4);
  border: 1px solid rgba(200,164,90,0.1);
  animation: fadeUp 0.7s ease 0.4s both;
}
.more-question-label {
  font-family: 'Cinzel', serif; font-size: 0.55rem;
  letter-spacing: 0.4em; color: var(--gold); opacity: 0.6; margin-bottom: 12px;
}
.more-question-title {
  font-size: 0.82rem; color: var(--white-dim);
  letter-spacing: 0.1em; line-height: 1.8; margin-bottom: 16px;
}
textarea.more-input {
  width: 100%; background: rgba(5,5,15,0.6);
  border: 1px solid rgba(200,164,90,0.15);
  color: var(--white); padding: 12px;
  font-family: 'Noto Serif JP', serif; font-size: 0.82rem;
  outline: none; resize: none; height: 80px;
  transition: border-color 0.3s;
}
textarea.more-input:focus { border-color: rgba(200,164,90,0.4); }
textarea.more-input::placeholder { color: rgba(240,235,224,0.2); }

.btn-send {
  width: 100%; padding: 14px; margin-top: 12px;
  background: transparent; border: 1px solid rgba(200,164,90,0.4);
  color: var(--gold); font-family: 'Cinzel', serif;
  font-size: 0.65rem; letter-spacing: 0.3em; cursor: pointer;
  transition: all 0.3s;
}
.btn-send:hover { border-color: var(--gold); background: rgba(200,164,90,0.05); }
.send-done { font-size: 0.7rem; color: var(--gold); text-align: center; margin-top: 8px; opacity: 0.8; display: none; }

.btn-back {
  display: block; width: fit-content; margin: 40px auto 0;
  padding: 13px 36px; background: transparent;
  border: 1px solid rgba(200,164,90,0.35);
  color: var(--gold); font-family: 'Cinzel', serif;
  font-size: 0.65rem; letter-spacing: 0.3em; cursor: pointer; transition: all 0.3s;
}
.btn-back:hover { border-color: var(--gold); background: rgba(200,164,90,0.05); }
</style>
</head>

let currentName = '';
let currentResult = '';

async function doKantei(){
  const name = document.getElementById('name').value.trim();
  const birthday = document.getElementById('birthday').value;
  const comment = document.getElementById('comment').value;
  const errEl = document.getElementById('error');

  errEl.textContent = '';
  if(!name){ errEl.textContent = 'お名前を入力してください'; return; }
  if(!birthday){ errEl.textContent = '生年月日を入力してください'; return; }

  document.getElementById('loading').classList.add('show');

  try {
    const res = await fetch('/kantei', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, birthday, comment})
    });
    const data = await res.json();
    if(data.error){ errEl.textContent = data.error; return; }

    currentName = name;
    currentResult = data.result;
    showResult(name, birthday, data.result);
  } catch(e) {
    errEl.textContent = 'エラーが発生しました';
  } finally {
    document.getElementById('loading').classList.remove('show');
  }
}

function showResult(name, birthday, character){
  document.getElementById('result-person').textContent = `✦ ${name} ✦`;
  document.getElementById('result-character').textContent = character;
  document.getElementById('result-birthday').textContent = birthday.replace(/-/g, '. ');

  const d = DB[character] || DB['単星'];
  const el = document.getElementById('result-sections');
  el.innerHTML = `
    <div style="text-align:center;margin:32px 0 24px;font-size:0.65rem;letter-spacing:0.35em;color:var(--gold);opacity:0.6;">${d.theme}</div>
    ${d.sections.map(s => `
      <div class="result-section">
        <div class="section-tag">${s.tag}</div>
        <div class="section-title">${s.title}</div>
        <div class="section-text">${s.text}</div>
      </div>
    `).join('')}
  `;

  document.getElementById('more-input').value = '';
  document.getElementById('send-done').style.display = 'none';
  document.getElementById('page-top').classList.remove('active');
  document.getElementById('page-result').classList.add('active');
  window.scrollTo(0, 0);
}

async function sendMore(){
  const more = document.getElementById('more-input').value.trim();
  if(!more) return;
  try {
    await fetch('/kantei', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: currentName, birthday: '', comment: `【追加質問】${more}`, result: currentResult})
    });
  } catch(e){}
  document.getElementById('send-done').style.display = 'block';
  document.getElementById('more-input').value = '';
}

function goBack(){
  document.getElementById('page-result').classList.remove('active');
  document.getElementById('page-top').classList.add('active');
  window.scrollTo(0, 0);
}
